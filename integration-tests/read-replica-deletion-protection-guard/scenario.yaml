name: rds-read-replica-deletion-protection-blue-green-guard
description: >
  Create a read replica with deletion protection, then run the source with
  blue_green_deployment enabled in dry-run and verify the new validation
  error refuses to enable it. Disable the protection before destroying the
  replica during cleanup.

base_input: integration-tests/read-replica-deletion-protection-guard/base_input.json

steps:
  - name: create deletion-protected read replica
    action: Apply
    dry_run: false
    timeout_seconds: 3600
    expect:
      exit_code: 0
      log_contains:
        - "Apply complete!"
      log_not_contains:
        - "Error:"

  - name: refuse blue green deployment enable
    input:
      identifier: "{{run_id}}"
      output_prefix: "{{run_id}}-rds"
      allow_major_version_upgrade: true
      deletion_protection: false
      replica_source: null
      parameter_group:
        name: erv2-tests-postgres-16
        description: Parameter Group for PostgreSQL 16
        family: postgres16
        parameters:
          - name: rds.logical_replication
            value: 1
            apply_method: pending-reboot
      blue_green_deployment:
        enabled: true
        switchover: false
        target:
          engine_version: "17.11"
          instance_class: db.t4g.micro
          parameter_group:
            name: erv2-tests-postgres-17
            description: Parameter Group for PostgreSQL 17
            family: postgres17
            parameters:
              - name: rds.logical_replication
                value: 1
                apply_method: pending-reboot
    action: Apply
    dry_run: true
    timeout_seconds: 1800
    expect:
      exit_code: 1
      log_contains:
        - "blue_green_deployment cannot be enabled: read replica(s)"
        - "still have deletion_protection enabled in AWS"
        - "two separate changes"
      log_not_contains:
        - "Apply complete!"

  - name: disable deletion protection on read replica
    input:
      deletion_protection: false
    action: Apply
    dry_run: false
    timeout_seconds: 3600
    expect:
      exit_code: 0
      log_contains:
        - "Apply complete!"
      log_not_contains:
        - "Error:"

cleanup:
  name: destroy read replica
  input:
    deletion_protection: false
  action: Destroy
  dry_run: false
  timeout_seconds: 3600
  expect:
    exit_code: 0
    log_contains:
      - "Destroy complete!"
    log_not_contains:
      - "Error:"
