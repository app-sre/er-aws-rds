name: rds-primary-storage-update-password-guard
description: >
  Create a primary RDS instance with a generated password, increase allocated
  storage from 20 GiB to 30 GiB without changing reset_password, and verify the
  update completes and the next reconcile is a no-op. This exercises the
  post-plan path for a storage-only DB instance update.
base_input: integration-tests/basic/base_input.json

steps:
  - name: create database
    action: Apply
    dry_run: false
    timeout_seconds: 3600
    expect:
      exit_code: 0
      log_contains:
        - "Apply complete!"
      log_not_contains:
        - "Error:"

  - name: increase allocated storage
    input:
      allocated_storage: 30
    action: Apply
    dry_run: false
    timeout_seconds: 3600
    expect:
      exit_code: 0
      log_contains:
        - "Apply complete!"
      log_not_contains:
        - "No changes."
        - "Cannot reset password for RDS instance"
        - "Error:"

  - name: verify steady state
    input:
      allocated_storage: 30
    action: Apply
    dry_run: false
    timeout_seconds: 3600
    expect:
      exit_code: 0
      log_contains:
        - "No changes."
      log_not_contains:
        - "Error:"

cleanup:
  name: destroy database
  input:
    allocated_storage: 30
  action: Destroy
  dry_run: false
  timeout_seconds: 3600
  expect:
    exit_code: 0
    log_contains:
      - "Destroy complete!"
    log_not_contains:
      - "Error:"
