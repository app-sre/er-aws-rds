name: rds-password-reset-during-storage-optimization
description: >
  Manual-only probe for a retained primary RDS instance from
  integration-tests/storage-update-password-guard/scenario.yaml. Run only while
  AWS reports storage-optimization. The dry-run keeps the password unchanged
  while verifying that the post-plan hook rejects the rotation.
base_input: integration-tests/basic/base_input.json

steps:
  - name: reject password reset during storage optimization
    input:
      allocated_storage: 30
      reset_password: "manual-storage-reset-{{run_id}}"
    action: Apply
    dry_run: true
    timeout_seconds: 1800
    expect:
      exit_code: 1
      log_contains:
        - "Cannot reset password for RDS instance"
        - "storage-optimization"
        - "Terraform apply was not started."
      log_not_contains:
        - "Apply complete!"
